.victory-rays { position:absolute;width:600px;height:600px;border-radius:50%;opacity:.13;background:repeating-conic-gradient(from 0deg,#d7ad69 0 1deg,transparent 1deg 15deg);animation:slow-spin 45s linear infinite; }.result-content h1 { font-size:clamp(46px,7vw,84px);letter-spacing:.1em;text-indent:.1em; }.result-stats { width:min(470px,100%);margin:32px auto 8px;padding:20px 0;display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid #c9a56b35;border-bottom:1px solid #c9a56b35; }.result-stats div+div { border-left:1px solid #c9a56b35; }.result-stats strong,.result-stats span { display:block; }.result-stats strong { color:#e3c187;font-size:23px; }.result-stats span { margin-top:5px;color:#8f8372;font-size:10px;letter-spacing:.16em; }.status-actions { display:flex;justify-content:center;gap:12px;margin-top:24px; }.status-actions button { margin-top:0; }
@keyframes status-reveal { from { opacity:0;clip-path:inset(50% 0 50%); } to { opacity:1;clip-path:inset(0); } } @keyframes status-content-in { from { opacity:0;transform:translateY(24px); } to { opacity:1;transform:translateY(0); } } @keyframes status-piece-in { from { opacity:0;transform:translateY(-28px) scale(.75) rotate(-9deg); } to { opacity:1;transform:none; } } @keyframes slow-spin { to { transform:rotate(360deg); } }
@media (max-width:900px) { .auth-shell { grid-template-columns:1fr;gap:38px;padding:42px 0; }.login-story { max-width:none;text-align:center; }.story-kicker,.piece-row,.story-meta { justify-content:center; }.login-story h1 { font-size:52px;margin:18px 0 12px; }.story-copy { margin:auto; }.login-card { width:min(460px,100%);margin:auto; }.mode-grid { grid-template-columns:1fr; }.game-shell { grid-template-columns:minmax(0,650px);padding:12px; }.game-panel { padding:0; }.record { min-height:180px; }.empty-record { height:120px; } }
@media (max-width:540px) { .login-header { height:72px;width:calc(100% - 30px); }.login-header>p { display:none; }.auth-shell { width:calc(100% - 24px);padding:28px 0;gap:28px; }.login-story h1 { font-size:38px; }.story-copy { font-size:12px;line-height:1.8; }.piece-row { margin:24px 0; }.story-piece { width:55px;height:55px;font-size:24px; }.story-meta { gap:16px; }.story-meta div { display:block; }.story-meta span { display:block;margin-top:3px; }.login-card { padding:30px 24px 24px; }.login-footer { padding:15px;flex-wrap:wrap; }.topbar { padding:0 16px; }.wordmark b { display:none; }.nav-actions>span:not(.avatar) { display:none; }.lobby-hero { padding-top:45px; }.mode-card { min-height:230px; }.game-header { padding:0 10px; }.game-header .wordmark { display:none; }.game-shell { padding:6px; }.board-frame { padding:8%;border-width:4px; }.river { font-size:clamp(16px,6vw,24px); }.river i { display:none; }.piece { width:92%;font-size:clamp(16px,7vw,28px);box-shadow:0 2px 4px #59351e88,inset 0 0 0 2px #e9c890,inset 0 0 0 4px currentColor,0 0 0 1px #6d421f; }.player-strip { height:52px; }.game-panel { padding:8px; }.turn-card { padding:14px; } }
@media (max-width:540px) { .status-page { padding:38px 20px; }.status-page::before { inset:10px; }.status-corner { display:none; }.status-piece { width:82px;height:82px;font-size:38px; }.status-content h1 { font-size:60px; }.result-content h1 { font-size:43px; }.result-stats { margin-top:25px; }.status-actions { flex-direction:column-reverse; }.status-actions button,.status-primary { width:100%; }.victory-rays { width:360px;height:360px; } }
@media (prefers-reduced-motion:reduce) { .screen-enter,.status-page,.status-content,.status-piece,.victory-rays { animation:none!important; } }
